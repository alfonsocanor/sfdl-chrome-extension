<template>
    <div class="sfdl-compare-logs" style={containerStyle}>
        <div class="sfdl-compare-logs__toolbar">
            <sfdl-log-manipulation-menu
                with-compare-options="true"
                oncheckboxselection={handleOptionsChange}>
            </sfdl-log-manipulation-menu>
            <span class="sfdl-compare-logs__hint"></span>
            <div class="sfdl-compare-logs__actions">
                <button
                    class="sfdl-compare-logs__swap slds-button slds-button_icon slds-is-selected slds-button_icon-border-filled slds-button_icon-border"
                    style="width:22px;height:22px;padding:2px;"
                    title="Swap the orgs and the logs of both sides"
                    disabled={isSwapDisabled}
                    onclick={handleSwap}>
                    <img class="sfdl-swap-icon" src={swapIcon} alt="swap sides"/>
                </button>
            </div>
        </div>
        <div class="sfdl-compare-logs__body">
            <sfdl-side-panel class="sfdl-compare-logs__left-panel" title="Left org" subtitle={leftOrgLabel} side="left" width="18rem">
                    <sfdl-combobox
                        class="sfdl-compare-logs__org-picker"
                        side="left"
                        label="Org"
                        placeholder="Pick the left org"
                        empty-message="No org session, log in to Salesforce first"
                        options={orgOptions}
                        value={leftOrgUrl}
                        data-side="left"
                        onchange={handleOrgChange}>
                    </sfdl-combobox>
                    <sfdl-compare-log-list
                        mode="single"
                        side="left"
                        session-information={leftOrgSession}
                        left-log-id={leftLogId}
                        no-session-message="Pick the org of the left side"
                        onlogselect={handleLogSelect}>
                    </sfdl-compare-log-list>
                </sfdl-side-panel>
            <div class="sfdl-compare-logs__diff">
                <sfdl-diff-viewer
                    language="apexlog"
                    left-label={leftLabel}
                    right-label={rightLabel}
                    left-content={leftContent}
                    right-content={rightContent}
                    loading={isLoadingLogs}
                    empty-message={emptyMessage}>
                </sfdl-diff-viewer>
            </div>
                <sfdl-side-panel class="sfdl-compare-logs__right-panel" title="Right org" subtitle={rightOrgLabel} side="right" width="18rem">
                    <sfdl-combobox
                        class="sfdl-compare-logs__org-picker"
                        side="right"
                        label="Org"
                        placeholder="Pick the right org"
                        empty-message="No org session, log in to Salesforce first"
                        options={orgOptions}
                        value={rightOrgUrl}
                        data-side="right"
                        onchange={handleOrgChange}>
                    </sfdl-combobox>
                    <sfdl-compare-log-list
                        mode="single"
                        side="right"
                        session-information={rightOrgSession}
                        right-log-id={rightLogId}
                        no-session-message="Pick the org of the right side"
                        onlogselect={handleLogSelect}>
                    </sfdl-compare-log-list>
                </sfdl-side-panel>
        </div>
    </div>
</template>
