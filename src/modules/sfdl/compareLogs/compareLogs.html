<template>
    <div class="sfdl-compare-logs" style={containerStyle}>
        <div class="sfdl-compare-logs__body">
            <template if:true={isSameOrg}>
                <!-- One org feeds both sides: two of its logs are ticked, the first
                     on the left, and a new tick replaces the last one. -->
                <sfdl-side-panel class="sfdl-compare-logs__list-panel" label="Log List" side="left" width="20rem" back-to-top="true">
                    <sfdl-combobox
                        slot="header"
                        class="sfdl-compare-logs__org-picker"
                        side="left"
                        label="Org"
                        placeholder="Pick the org"
                        empty-message="No org session, log in to an org first"
                        options={allOrgOptions}
                        value={leftOrgUrl}
                        data-side="left"
                        onchange={handleOrgChange}>
                    </sfdl-combobox>
                    <sfdl-compare-log-list
                        side="both"
                        session-information={leftOrgSession}
                        left-log-id={leftLogId}
                        right-log-id={rightLogId}
                        no-session-message="Pick the org of the logs"
                        onlogselect={handleLogSelect}>
                    </sfdl-compare-log-list>
                </sfdl-side-panel>
            </template>
            <template if:true={isTwoOrgs}>
                <!-- The org of each side is picked where its title would be, its
                     colour telling the side. Folded, each reads Log List. -->
                <sfdl-side-panel class="sfdl-compare-logs__left-panel" label="Log List" side="left" width="20rem" back-to-top="true">
                    <sfdl-combobox
                        slot="header"
                        class="sfdl-compare-logs__org-picker"
                        side="left"
                        label="Left org"
                        placeholder="Pick the left org"
                        empty-message="No other org session, log in to another org first"
                        options={leftOrgOptions}
                        value={leftOrgUrl}
                        data-side="left"
                        onchange={handleOrgChange}>
                    </sfdl-combobox>
                    <sfdl-compare-log-list
                        side="left"
                        session-information={leftOrgSession}
                        left-log-id={leftLogId}
                        no-session-message="Pick the org of the left side"
                        onlogselect={handleLogSelect}>
                    </sfdl-compare-log-list>
                </sfdl-side-panel>
            </template>
            <div class="sfdl-compare-logs__diff">
                <!-- Six pills do not fit the bar of the diff, they get a row above
                     it. The row and the bar only come with two logs to compare. -->
                <template if:true={hasComparison}>
                    <div class="sfdl-compare-logs__filters">
                        <sfdl-log-manipulation-menu
                            options={options}
                            oncheckboxselection={handleOptionsChange}>
                        </sfdl-log-manipulation-menu>
                    </div>
                </template>
                <!-- A new log on one side only reloads that side. -->
                <sfdl-diff-viewer
                    language="apexlog"
                    left-label={leftLabel}
                    right-label={rightLabel}
                    left-content={leftContent}
                    right-content={rightContent}
                    loading={isLoadingLogs}
                    loading-side={pendingSide}
                    side-loading-message={pendingMessage}
                    hide-empty-summary={hideEmptySummary}
                    empty-message={emptyMessage}>
                </sfdl-diff-viewer>
            </div>
            <template if:true={isTwoOrgs}>
                <sfdl-side-panel class="sfdl-compare-logs__right-panel" label="Log List" side="right" width="20rem" back-to-top="true">
                    <sfdl-combobox
                        slot="header"
                        class="sfdl-compare-logs__org-picker"
                        side="right"
                        label="Right org"
                        placeholder="Pick the right org"
                        empty-message="No other org session, log in to another org first"
                        options={rightOrgOptions}
                        value={rightOrgUrl}
                        data-side="right"
                        onchange={handleOrgChange}>
                    </sfdl-combobox>
                    <sfdl-compare-log-list
                        side="right"
                        session-information={rightOrgSession}
                        right-log-id={rightLogId}
                        no-session-message="Pick the org of the right side"
                        onlogselect={handleLogSelect}>
                    </sfdl-compare-log-list>
                </sfdl-side-panel>
            </template>
        </div>
    </div>
</template>
