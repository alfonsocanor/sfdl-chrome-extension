<template>
    <div class="sfdl-compare-logs" style={containerStyle}>
        <div class="sfdl-compare-logs__body">
            <template if:false={isPairMode}>
                <!-- The org of each side is picked where its title would be, its
                     colour telling the side. Folded, each reads Log List. -->
                <sfdl-side-panel class="sfdl-compare-logs__left-panel" label="Log List" side="left" width="18rem">
                    <sfdl-combobox
                        slot="header"
                        class="sfdl-compare-logs__org-picker"
                        side="left"
                        label="Left org"
                        placeholder="Pick the left org"
                        empty-message="No other org session, log in to another org first"
                        options={leftOrgOptions}
                        value={leftOrgUrl}
                        data-side="left"
                        onchange={handleOrgChange}>
                    </sfdl-combobox>
                    <sfdl-compare-log-list
                        side="left"
                        session-information={leftOrgSession}
                        left-log-id={leftLogId}
                        no-session-message="Pick the org of the left side"
                        onlogselect={handleLogSelect}>
                    </sfdl-compare-log-list>
                </sfdl-side-panel>
            </template>
            <div class="sfdl-compare-logs__diff">
                <!-- Six pills do not fit the bar of the diff, they get a row above it. -->
                <div class="sfdl-compare-logs__filters">
                    <sfdl-log-manipulation-menu
                        options={options}
                        oncheckboxselection={handleOptionsChange}>
                    </sfdl-log-manipulation-menu>
                </div>
                <sfdl-diff-viewer
                    language="apexlog"
                    left-label={leftLabel}
                    right-label={rightLabel}
                    left-content={leftContent}
                    right-content={rightContent}
                    loading={isLoadingLogs}
                    empty-message={emptyMessage}>
                    <template if:true={isPairMode}>
                        <button
                            slot="actions"
                            class="sfdl-compare-logs__pair-swap slds-button slds-button_icon slds-is-selected slds-button_icon-border-filled slds-button_icon-border"
                            style="width:22px;height:22px;padding:2px;"
                            title="Swap the two logs"
                            onclick={handleSwap}>
                            <img class="sfdl-swap-icon" src={swapIcon} alt="swap the logs"/>
                        </button>
                        <button
                            slot="actions"
                            class="sfdl-compare-logs__close slds-button slds-button_icon slds-is-selected slds-button_icon-border-filled slds-button_icon-border"
                            style="width:22px;height:22px;padding:2px;"
                            title="Close the comparison and go back to the log"
                            onclick={handleClose}>
                            <img src={closeIcon} alt="close the comparison"/>
                        </button>
                    </template>
                </sfdl-diff-viewer>
            </div>
            <template if:false={isPairMode}>
                <sfdl-side-panel class="sfdl-compare-logs__right-panel" label="Log List" side="right" width="18rem">
                    <sfdl-combobox
                        slot="header"
                        class="sfdl-compare-logs__org-picker"
                        side="right"
                        label="Right org"
                        placeholder="Pick the right org"
                        empty-message="No other org session, log in to another org first"
                        options={rightOrgOptions}
                        value={rightOrgUrl}
                        data-side="right"
                        onchange={handleOrgChange}>
                    </sfdl-combobox>
                    <sfdl-compare-log-list
                        side="right"
                        session-information={rightOrgSession}
                        right-log-id={rightLogId}
                        no-session-message="Pick the org of the right side"
                        onlogselect={handleLogSelect}>
                    </sfdl-compare-log-list>
                </sfdl-side-panel>
            </template>
        </div>
    </div>
</template>
