<template>
    <template if:true={isDownloading}> 
        <div class="slds-grid slds-wrap">
            <div style="color:rgb(127 127 127);" class="slds-col slds-size_7-of-8">
                Downloading...
            </div>
        </div> 
        <div class="slds-grid slds-wrap">
            <div class="slds-col slds-size_11-of-12 sfdl-process-bar" style="margin-bottom: 8px;">
                <sfdl-process-bar 
                    total={totalLogsToDownload}
                    placeholder="Downloading logs...">
                </sfdl-process-bar>
            </div>
            <div class="slds-col slds-size_1-of-12 slds-align_absolute-center">
                <button style="width:12px;height:12px; padding:2px;" onclick={cancelDownload} 
                    class="slds-button slds-button_icon slds-is-selected slds-button_icon-border-filled slds-button_icon-border" 
                    title="cancel logs">
                        <img src={closeIcon} alt="cancel download"/>
                </button>
            </div>
        </div>
        <sfdl-download-logs 
            log-list={logs2Download}
            session-information={sessionInformation}
            manipulation-options={manipulationOptions}
            ondownloadprogress={handleDownloadProgress}
            ondownloadprocesscompleted={handleDownloadProcessCompleted}>
        </sfdl-download-logs>
    </template>
    <template if:true={thereAreLogsToDisplay}>
        <template if:false={isDownloading}>
            <div class="sfdl-log-list-actions slds-size_1-of-1 slds-m-bottom_small" style="text-align:left;">
                <input type="checkbox" class="selectAllLogsCheckbox sfdl-log-checkbox" checked={areAllLogsSelected} onchange={handleSelectAllLogs} title={selectAllTitle}/>
                <button class="downloadLogsButton" onclick={handleDownloadLogs} title={downloadButtonTitle}>
                    <img class="sfdl-download-action-icon" src={downloadIcon} alt=""/>
                    <span class="sfdl-download-label">{downloadLabel}</span>
                </button>
                <template if:true={thereAreSelectedLogs}>
                    <button class="clearSelectionButton sfdl-clear-selection" onclick={handleClearSelection} title="Unselect every log">unselect</button>
                </template>
            </div>
        </template>
        <ul class="slds-has-dividers_around slds-has-block-links">
            <template for:each={logList} for:item="log">
                <li key={log.id} class="slds-item custom-animation">
                    <div class="sfdl-log-row">
                        <input 
                            type="checkbox" 
                            class="selectLogCheckbox sfdl-log-checkbox"
                            data-logid={log.id}
                            checked={log.isSelected}
                            onchange={handleLogSelection}
                            title="Select this log to download"/>
                        <button 
                            class="displayLogButton logList"
                            data-logid={log.id} 
                            data-logname={log.name} 
                            onclick={handleLogInfo}
                            onkeyup={preventDefault}
                            onkeydown={onKeyArrowsPressed}
                            style="text-align: left; border: none !important;">
                            {log.name}
                        </button>
                        <button 
                            class="downloadSingleLogButton slds-button slds-button_icon"
                            data-logid={log.id}
                            onclick={handleDownloadSingleLog}
                            title="Download this log">
                            <img src={downloadIcon} alt="download this log"/>
                        </button>
                    </div>
                </li>
            </template>
        </ul>
    </template>
</template>
