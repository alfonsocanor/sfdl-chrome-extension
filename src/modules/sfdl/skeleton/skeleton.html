<template>
    <div class="sfdl-skeleton" role="status" aria-busy="true" aria-label={label}>
        <ul class={listClass} aria-hidden="true">
            <template for:each={items} for:item="item">
                <li key={item.key} class={itemClass}>
                    <div class={rowClassName}>
                        <template for:each={item.bones} for:item="bone">
                            <span key={bone.key} class={bone.className} style={bone.style}>
                                <template for:each={bone.lines} for:item="line">
                                    <span key={line.key} class="sfdl-skeleton__bone sfdl-skeleton__line" style={line.style}></span>
                                </template>
                            </span>
                        </template>
                    </div>
                </li>
            </template>
        </ul>
    </div>
</template>
