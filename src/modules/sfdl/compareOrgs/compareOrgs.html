<template>
    <div class="sfdl-compare-orgs" style={containerStyle}>
        <div class="sfdl-compare-orgs__toolbar">
            <sfdl-combobox
                class="sfdl-compare-orgs__org sfdl-compare-orgs__left-org"
                side="left"
                label="Left org"
                placeholder="Pick the left org"
                empty-message="No other org session, log in to another org first"
                options={leftOrgOptions}
                value={leftOrgUrl}
                badge={leftOrgBadge}
                badge-pulse={leftOrgBadgePulse}
                data-side="left"
                onchange={handleOrgChange}>
            </sfdl-combobox>
            <sfdl-combobox
                class="sfdl-compare-orgs__org sfdl-compare-orgs__right-org"
                side="right"
                label="Right org"
                placeholder="Pick the right org"
                empty-message="No other org session, log in to another org first"
                options={rightOrgOptions}
                value={rightOrgUrl}
                badge={rightOrgBadge}
                badge-pulse={rightOrgBadgePulse}
                data-side="right"
                onchange={handleOrgChange}>
            </sfdl-combobox>
        </div>
        <div class="sfdl-compare-orgs__body">
            <sfdl-side-panel class="sfdl-compare-orgs__results-panel" title="Components" dock="left" width="24rem" back-to-top="true">
                <sfdl-combobox
                    slot="header"
                    class="sfdl-compare-orgs__type"
                    placeholder="Pick what to compare"
                    options={typeOptions}
                    value={typeKey}
                    badge={typeBadge}
                    badge-pulse={typeBadgePulse}
                    onchange={handleTypeChange}>
                </sfdl-combobox>
                <template if:true={errorMessage}>
                    <p class="sfdl-compare-orgs__error">{errorMessage}</p>
                </template>
                <template if:true={isFirstListing}>
                    <sfdl-loading-stencil type="componentList" label="Listing the components"></sfdl-loading-stencil>
                </template>
                <template if:true={hasListed}>
                    <sfdl-compare-results
                        components={components}
                        selected-name={selectedName}
                        selected-path={selectedPath}
                        type-label={typeLabel}
                        left-name={leftOrgName}
                        right-name={rightOrgName}
                        oncomponentopen={handleComponentOpen}
                        onfileopen={handleFileOpen}>
                    </sfdl-compare-results>
                </template>
                <template if:true={showPanelHint}>
                    <p class="sfdl-compare-orgs__hint">{panelHint}</p>
                </template>
            </sfdl-side-panel>
            <div class="sfdl-compare-orgs__diff">
                <sfdl-diff-viewer
                    left-label={leftOrgName}
                    right-label={rightOrgName}
                    left-status={leftStatus}
                    right-status={rightStatus}
                    left-content={leftContent}
                    right-content={rightContent}
                    language={selectedLanguage}
                    notice={selectedNotice}
                    identical-message={identicalMessage}
                    loading={isDiffLoading}
                    loading-side={pendingSideOnScreen}
                    side-loading-message={pendingMessage}
                    hide-empty-summary={hideEmptySummary}
                    empty-message={emptyMessage}>
                </sfdl-diff-viewer>
            </div>
        </div>
    </div>
</template>
