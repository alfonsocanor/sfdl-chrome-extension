<template>
    <div class="sfdl-compare-orgs" style={containerStyle}>
        <div class="sfdl-compare-orgs__toolbar">
            <sfdl-combobox
                class="sfdl-compare-orgs__org sfdl-compare-orgs__left-org"
                side="left"
                label="Left org"
                placeholder="Pick the left org"
                empty-message="No org session, log in to Salesforce first"
                options={orgOptions}
                value={leftOrgUrl}
                data-side="left"
                onchange={handleOrgChange}>
            </sfdl-combobox>
            <button
                class="sfdl-compare-orgs__swap sfdl-compare-orgs__toolbar-button slds-button slds-button_icon slds-is-selected slds-button_icon-border-filled slds-button_icon-border"
                style="width:22px;height:22px;padding:2px;"
                title="Swap the orgs of both sides"
                disabled={isSwapDisabled}
                onclick={handleSwap}>
                <img class="sfdl-swap-icon" src={swapIcon} alt="swap the orgs"/>
            </button>
            <sfdl-combobox
                class="sfdl-compare-orgs__org sfdl-compare-orgs__right-org"
                side="right"
                label="Right org"
                placeholder="Pick the right org"
                empty-message="No org session, log in to Salesforce first"
                options={orgOptions}
                value={rightOrgUrl}
                data-side="right"
                onchange={handleOrgChange}>
            </sfdl-combobox>
            <sfdl-combobox
                class="sfdl-compare-orgs__type"
                label="Metadata"
                placeholder="Pick what to compare"
                options={typeOptions}
                value={typeKey}
                onchange={handleTypeChange}>
            </sfdl-combobox>
            <button
                class="sfdl-compare-orgs__refresh sfdl-compare-orgs__toolbar-button slds-button slds-button_icon slds-is-selected slds-button_icon-border-filled slds-button_icon-border"
                style="width:22px;height:22px;padding:2px;"
                title="Retrieve both orgs again"
                disabled={isRefreshDisabled}
                onclick={handleRefresh}>
                <img src={refreshIcon} alt="retrieve both orgs again"/>
            </button>
            <label class="sfdl-compare-orgs__managed" title="Compare the components of installed packages too">
                <input type="checkbox" class="sfdl-compare-orgs__managed-checkbox" checked={includeManaged} onchange={handleManagedChange}/>
                <span>Include managed packages</span>
            </label>
        </div>
        <div class="sfdl-compare-orgs__body">
            <sfdl-side-panel class="sfdl-compare-orgs__results-panel" title="Components" subtitle={resultsSubtitle} dock="left" width="24rem">
                <template if:true={showProgress}>
                    <div class="sfdl-compare-orgs__progress">
                        <template for:each={sideProgress} for:item="progress">
                            <div key={progress.side} class="sfdl-compare-orgs__progress-row" data-side={progress.side}>
                                <span class={progress.swatchClass}></span>
                                <span class="sfdl-compare-orgs__progress-org" title={progress.orgName}>{progress.orgName}</span>
                                <span class={progress.statusClass} title={progress.statusTitle}>{progress.statusLabel}</span>
                            </div>
                        </template>
                    </div>
                </template>
                <template if:true={errorMessage}>
                    <p class="sfdl-compare-orgs__error">{errorMessage}</p>
                </template>
                <template if:true={hasCompared}>
                    <sfdl-compare-results
                        entries={entries}
                        selected-path={selectedPath}
                        type-label={typeLabel}
                        left-name={leftOrgName}
                        right-name={rightOrgName}
                        oncomponentselect={handleComponentSelect}>
                    </sfdl-compare-results>
                </template>
                <template if:true={showPanelHint}>
                    <p class="sfdl-compare-orgs__hint">{panelHint}</p>
                </template>
            </sfdl-side-panel>
            <div class="sfdl-compare-orgs__diff">
                <sfdl-diff-viewer
                    left-label={leftOrgName}
                    right-label={rightOrgName}
                    left-content={leftContent}
                    right-content={rightContent}
                    language={selectedLanguage}
                    notice={selectedNotice}
                    identical-message={identicalMessage}
                    loading={isComparing}
                    empty-message={emptyMessage}>
                </sfdl-diff-viewer>
            </div>
        </div>
    </div>
</template>
