<template>
    <section class={panelClass} style={panelStyle}>
        <template if:true={collapsed}>
            <div class="sfdl-side-panel__strip">
                <button
                    class="sfdl-side-panel__expand slds-button slds-button_icon slds-is-selected slds-button_icon-border-filled slds-button_icon-border"
                    style="width:22px;height:22px;padding:2px;"
                    title={expandTitle}
                    onclick={handleToggle}>
                    <img src={expandIcon} alt={expandTitle}/>
                </button>
                <span class="sfdl-side-panel__strip-title" title={name}>{name}</span>
            </div>
        </template>
        <!-- Hidden rather than removed while collapsed, so the content keeps
             its state and its scroll position. -->
        <div class={contentClass}>
            <div class="slds-panel__header sfdl-side-panel__header">
                <div class="sfdl-side-panel__titles">
                    <template if:true={title}>
                        <h2 class="slds-panel__header-title slds-text-heading_small slds-truncate" title={title}>{title}</h2>
                    </template>
                    <template if:true={subtitle}>
                        <p class="sfdl-side-panel__subtitle slds-truncate" title={subtitle}>{subtitle}</p>
                    </template>
                    <slot name="header"></slot>
                </div>
                <div class="sfdl-side-panel__actions">
                    <slot name="actions"></slot>
                    <button
                        class="sfdl-side-panel__collapse slds-button slds-button_icon slds-is-selected slds-button_icon-border-filled slds-button_icon-border"
                        style="width:22px;height:22px;padding:2px;"
                        title={collapseTitle}
                        onclick={handleToggle}>
                        <img src={collapseIcon} alt={collapseTitle}/>
                    </button>
                </div>
            </div>
            <div class="sfdl-side-panel__body" tabindex={bodyTabIndex} onscroll={handleBodyScroll}>
                <slot></slot>
            </div>
            <!-- Back to the top (`back-to-top`): drawn outside the body that
                 scrolls, at the foot of the panel, or it would scroll away with
                 the list. It rises once the list is scrolled half a panel down
                 and goes as soon as the top is back. -->
            <template if:true={backToTop}>
                <div class="sfdl-side-panel__back-to-top-dock">
                    <div class={backToTopClass} aria-hidden={backToTopHidden}>
                        <button
                            class="slds-button slds-button_outline-brand sfdl-side-panel__back-to-top-button"
                            tabindex={backToTopTabIndex}
                            onclick={handleBackToTop}>
                            <img class="sfdl-side-panel__back-to-top-icon" src={backToTopIcon} alt=""/>
                            Back to the top
                        </button>
                    </div>
                </div>
            </template>
        </div>
    </section>
</template>
