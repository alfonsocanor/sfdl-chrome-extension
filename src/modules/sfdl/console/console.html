<template>
  <div style="display: flex; flex-direction: column; min-height: 100vh;">
    <div class="slds-tabs_default__content slds-show" style="flex: 1; padding:0;">
      <div class="slds-tabs_scoped slds-tabs_small sfdl-console-tabs">
        <ul class="slds-tabs_scoped__nav">
          <li class={debugLogsTabClass} title="Debug Logs">
            <a class="slds-tabs_scoped__link" data-tabname="debugLogs" onclick={handleTabNavigation}>Debug Logs</a>
          </li>
          <li class={compareMetadataTabClass} title="Compare Metadata">
            <a class="slds-tabs_scoped__link" data-tabname="compareMetadata" onclick={handleTabNavigation}>Compare Metadata</a>
          </li>
        </ul>
        <div class={debugLogsContentClass} style="padding:0; border-right:none;">
          <div class="sfdl-debug-logs__toolbar">
            <div class="slds-button-group" role="group">
              <button class={analyseButtonClass} data-mode="analyse" aria-pressed={isAnalysePressed} onclick={handleLogsModeChange}>Analyse</button>
              <button class={compareButtonClass} data-mode="compare" aria-pressed={isComparePressed} onclick={handleLogsModeChange}>Compare two orgs</button>
            </div>
            <span class="sfdl-debug-logs__hint">{logsHint}</span>
          </div>
          <div class={analyseViewClass}>
            <div class="sfdl-body-tab" style={sectionStyle}>
              <!-- Like the panels of the compare tabs: the org whose logs are
                   listed is picked where a title would be, and the panel folds
                   into a strip reading Log List. -->
              <sfdl-side-panel class="sfdl-console-log-list-section" label="Log List" side="left" width="20rem">
                <sfdl-picklist
                  slot="header"
                  class="sfdl-log-list-panel__org"
                  onsessioninformation={handleSessionInformation}
                  onenablepicklistbuttons={handleActivateActionButtons}
                  placeholder="Select your domain">
                </sfdl-picklist>
                <template if:true={renderLogList}>
                  <sfdl-log-list
                    is-analise-logs="true"
                    onlogdetails={handleLogDetails}
                    oncomparelogs={handleCompareLogs}
                    onenablepicklistbuttons={handleActivateActionButtons}
                    session-information={sessionInformation}
                    onisloading={handleIsLoading}>
                  </sfdl-log-list>
                </template>
              </sfdl-side-panel>
              <div class="slds-col" style="position:relative;">
                <sfdl-log-details
                  class={logDetailsClass}
                  is-analise-logs="true"
                  onenablepicklistbuttons={handleActivateActionButtons}
                  onmanipulationoptions={handleManipulationOptions}>
                </sfdl-log-details>
                <template if:true={pairComparison}>
                  <sfdl-compare-logs
                    class="sfdl-debug-logs__pair"
                    pair={pairComparison}
                    onclose={handleClosePairComparison}>
                  </sfdl-compare-logs>
                </template>
              </div>
            </div>
          </div>
          <!-- Built the first time it is opened, and hidden rather than destroyed
               from then on so it keeps the comparison left on screen. -->
          <template if:true={compareTwoOrgsRendered}>
            <div class={compareTwoOrgsViewClass}>
              <sfdl-compare-logs
                orgs={orgs}
                session-information={sessionInformation}
                height={logsBodyHeight}>
              </sfdl-compare-logs>
            </div>
          </template>
        </div>
        <template if:true={compareMetadataRendered}>
          <div class={compareMetadataContentClass} style="padding:0; border-right:none;">
            <sfdl-compare-orgs
              orgs={orgs}
              session-information={sessionInformation}
              height={bodyHeight}>
            </sfdl-compare-orgs>
          </div>
        </template>
      </div>
    </div>
    <div class="sfdl-footer-container" style="flex-shrink: 0; height: 32px;">
      <sfdl-footer></sfdl-footer>
    </div>
  </div>
</template>
