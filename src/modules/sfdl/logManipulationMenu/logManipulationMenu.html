<template>
    <div class="sfdl-log-filters" role="group" aria-label="Log filters">
        <template for:each={pills} for:item="pill">
            <div key={pill.name} class="sfdl-log-filter">
                <button
                    type="button"
                    class={pill.pillClass}
                    data-name={pill.name}
                    aria-pressed={pill.ariaPressed}
                    onclick={handleToggle}>
                    {pill.label}
                </button>
                <!-- Right on hover, what the filter does to the log. -->
                <template if:true={pill.description}>
                    <div class="slds-popover slds-popover_tooltip slds-nubbin_top-left sfdl-log-filter__tooltip" role="tooltip">
                        <div class="slds-popover__body">{pill.description}</div>
                    </div>
                </template>
            </div>
        </template>
    </div>
</template>
