<template>
    <div class="slds-form-element sfdl-combobox">
        <template if:true={showLabel}>
            <span class="slds-form-element__label sfdl-combobox-label">{label}</span>
        </template>
        <div class={controlClass}>
            <div class="slds-combobox_container">
                <!-- The step this picker is, on its corner while it waits for a
                     value. Hovered, an X takes the place of the number, to close
                     the numbers of the steps for good. -->
                <template if:true={showBadge}>
                    <button
                        type="button"
                        class={badgeClass}
                        title={badgeTitle}
                        aria-label="Hide the numbers of the steps"
                        tabindex="-1"
                        onclick={handleBadgeDismiss}
                        onanimationend={handleBadgeAnimationEnd}>
                        <span class="sfdl-combobox-badge__number">{badge}</span>
                        <span class="sfdl-combobox-badge__close" aria-hidden="true">&times;</span>
                    </button>
                </template>
                <div class={comboboxClass}>
                    <div class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_right" role="none">
                        <!-- Searchable, a field to type into that narrows the list. -->
                        <template if:true={searchable}>
                            <input
                                type="text"
                                class="slds-input slds-combobox__input sfdl-combobox-button sfdl-combobox-search"
                                role="combobox"
                                autocomplete="off"
                                spellcheck="false"
                                disabled={disabled}
                                placeholder={placeholder}
                                title={buttonTitle}
                                aria-label={label}
                                aria-autocomplete="list"
                                aria-haspopup="listbox"
                                aria-expanded={ariaExpanded}
                                value={fieldValue}
                                onclick={handleSearchClick}
                                oninput={handleSearchInput}
                                onblur={handleBlur}
                                onkeydown={handleKeyDown}/>
                        </template>
                        <template if:false={searchable}>
                            <button
                                type="button"
                                class="slds-input_faux slds-combobox__input sfdl-combobox-button"
                                disabled={disabled}
                                title={buttonTitle}
                                aria-label={label}
                                aria-haspopup="listbox"
                                aria-expanded={ariaExpanded}
                                onclick={handleToggle}
                                onblur={handleBlur}
                                onkeydown={handleKeyDown}>
                                <span class={valueClass}>{displayLabel}</span>
                            </button>
                        </template>
                        <span class="slds-icon_container slds-input__icon slds-input__icon_right">
                            <img src={fieldIcon} alt=""/>
                        </span>
                    </div>
                    <div class="slds-dropdown slds-dropdown_length-10 slds-dropdown_fluid" role="listbox" onmousedown={keepFocusOnButton}>
                        <ul class="slds-listbox slds-listbox_vertical" role="presentation">
                            <template for:each={items} for:item="item">
                                <li key={item.key} role="presentation" class="slds-listbox__item">
                                    <template if:true={item.isGroup}>
                                        <div class="slds-media slds-listbox__option slds-listbox__option_plain" role="presentation">
                                            <h3 class="slds-listbox__option-header" role="presentation">{item.label}</h3>
                                        </div>
                                    </template>
                                    <template if:false={item.isGroup}>
                                        <div
                                            class={item.optionClass}
                                            role="option"
                                            aria-selected={item.ariaSelected}
                                            data-value={item.value}
                                            onclick={handleSelect}>
                                            <span class="slds-media__body">
                                                <span class="slds-truncate" title={item.label}>{item.label}</span>
                                            </span>
                                        </div>
                                    </template>
                                </li>
                            </template>
                            <template if:true={isEmpty}>
                                <li role="presentation" class="slds-listbox__item">
                                    <div class="slds-media slds-listbox__option slds-listbox__option_plain sfdl-combobox-empty" role="presentation">{emptyMessage}</div>
                                </li>
                            </template>
                            <template if:true={hasNoMatch}>
                                <li role="presentation" class="slds-listbox__item">
                                    <div class="slds-media slds-listbox__option slds-listbox__option_plain sfdl-combobox-empty" role="presentation">{noMatchMessage}</div>
                                </li>
                            </template>
                        </ul>
                    </div>
                </div>
            </div>
            <!-- The border in the colour of the side says which one it is, the
                 label only comes on hover, with the whole org name. -->
            <template if:true={showTooltip}>
                <div class={tooltipClass} role="tooltip">
                    <div class="slds-popover__body">
                        <div class="sfdl-combobox-tooltip__label">{label}</div>
                        <template if:true={selectedOption}>
                            <div class="sfdl-combobox-tooltip__value">{selectedOption.label}</div>
                        </template>
                    </div>
                </div>
            </template>
        </div>
    </div>
</template>
